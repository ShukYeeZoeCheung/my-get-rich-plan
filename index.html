<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>成為富婆GOGOGO - Sakura Planner</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="富婆記帳">
    
    <link id="apple-icon" rel="apple-touch-icon" href="">
    <link id="favicon" rel="icon" sizes="192x192" href="">

    <script>
        (function() {
            const canvas = document.createElement('canvas');
            canvas.width = 192;
            canvas.height = 192;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, 192, 192);

            ctx.fillStyle = '#FF85A1';
            ctx.beginPath();
            ctx.moveTo(76, 75);
            ctx.lineTo(50, 35);
            ctx.lineTo(142, 35);
            ctx.lineTo(116, 75);
            ctx.fill();

            ctx.fillStyle = '#FFB7C5';
            ctx.fillRect(76, 65, 40, 15);

            ctx.fillStyle = '#FF85A1';
            ctx.beginPath();
            ctx.arc(96, 120, 55, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 45px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', 96, 125);

            const pngDataUrl = canvas.toDataURL('image/png');
            document.getElementById('apple-icon').href = pngDataUrl;
            document.getElementById('favicon').href = pngDataUrl;
        })();
    </script>

    <style>
        :root {
            --sakura-pink: #FFB7C5;
            --sakura-deep: #FF85A1;
            --sakura-light: #FFF0F3;
            --income-blue: #88B0D8;
            --gold: #D4AF37;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #FFF9FA;
            margin: 0;
            display: flex;
            justify-content: center;
            color: #5D5D5D;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            background: #FFF9FA;
            min-height: 100vh;
            position: relative;
            padding-bottom: 120px;
        }

        .page {
            display: none;
            padding: 0 0 20px 0;
            animation: fadeIn 0.3s ease;
        }

        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header { padding: 30px 25px 10px; text-align: center; }
        .title { color: var(--sakura-deep); font-size: 26px; font-weight: 900; margin: 0; letter-spacing: 1px; }
        .subtitle { font-size: 10px; color: var(--sakura-pink); letter-spacing: 3px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }

        .balance-card {
            background: linear-gradient(135deg, #FF85A1 0%, #FFB7C5 100%);
            margin: 0 20px 20px;
            padding: 25px;
            border-radius: 30px;
            color: white;
            box-shadow: 0 10px 20px rgba(255, 133, 161, 0.3);
            text-align: left;
        }

        .balance-amount { font-size: 36px; font-weight: 900; margin: 5px 0; }
        .balance-label { font-size: 12px; font-weight: bold; opacity: 0.9; }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 0 20px 20px;
        }

        .summary-item {
            background: white;
            padding: 15px;
            border-radius: 20px;
            border: 1px solid var(--sakura-light);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .summary-item.full { grid-column: span 2; background: var(--sakura-light); border: 1px solid var(--sakura-pink); }
        .summary-val { font-size: 18px; font-weight: 900; margin-top: 5px; }
        .summary-lab { font-size: 10px; font-weight: bold; color: #AAA; }
        .val-income { color: var(--income-blue); }
        .val-expense { color: var(--sakura-deep); }
        .val-balance { color: #D4AF37; }

        .settings-section {
            background: white;
            margin: 0 20px 20px;
            padding: 15px;
            border-radius: 20px;
            border: 1px solid var(--sakura-light);
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #FFF9FA;
        }

        .setting-row:last-child { border-bottom: none; }
        .settings-label { font-size: 12px; font-weight: bold; color: #888; display: flex; align-items: center; }
        .settings-label span { color: var(--sakura-deep); margin-right: 6px; }
        
        /* 新增：目標名稱輸入框樣式 */
        .settings-name-input {
            border: none;
            border-bottom: 1px dashed var(--sakura-pink);
            background: transparent;
            font-size: 12px;
            font-weight: bold;
            color: #5D5D5D;
            width: 90px;
            outline: none;
            padding: 2px 0;
        }
        .settings-name-input:focus {
            border-bottom: 1px solid var(--sakura-deep);
            color: var(--sakura-deep);
        }

        .settings-input {
            width: 90px;
            border: none;
            border-bottom: 2px solid var(--sakura-light);
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            color: var(--sakura-deep);
            outline: none;
            padding: 4px;
            background: transparent;
        }

        .section-title {
            font-size: 11px;
            font-weight: 900;
            color: var(--sakura-pink);
            margin: 20px 20px 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .goal-card {
            background: white;
            padding: 15px;
            border-radius: 20px;
            margin: 0 20px 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            border: 1px solid #FFF0F3;
        }

        .goal-icon { width: 45px; height: 45px; background: var(--sakura-light); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .goal-info { flex: 1; }
        .goal-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .goal-name { font-size: 13px; font-weight: bold; }
        .goal-target-text { font-size: 10px; color: #AAA; font-weight: normal; }
        .goal-percent { font-size: 12px; color: var(--sakura-deep); font-weight: 900; }
        .progress-bg { height: 8px; background: #F0F0F0; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--sakura-pink), var(--sakura-deep)); border-radius: 10px; transition: width 0.6s ease; }

        .nav-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 40px;
            display: flex;
            box-shadow: 0 15px 35px rgba(255, 133, 161, 0.2);
            border: 1px solid white;
            z-index: 1000;
        }

        .nav-item { flex: 1; padding: 12px; text-align: center; border-radius: 30px; font-size: 12px; font-weight: 900; cursor: pointer; color: var(--sakura-pink); transition: 0.3s; }
        .nav-item.active { background: var(--sakura-deep); color: white; }

        .input-card { background: white; margin: 0 20px; padding: 20px; border-radius: 25px; border: 1.5px solid var(--sakura-light); }
        .type-toggle { display: flex; background: var(--sakura-light); border-radius: 15px; padding: 4px; margin-bottom: 20px; }
        .type-btn { flex: 1; padding: 10px; text-align: center; font-size: 12px; font-weight: 900; border-radius: 12px; cursor: pointer; color: var(--sakura-deep); }
        .type-btn.active.expense { background: var(--sakura-deep); color: white; }
        .type-btn.active.income { background: var(--income-blue); color: white; }
        
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 10px; font-weight: 900; color: var(--sakura-pink); margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px 15px; border-radius: 15px; border: 1.5px solid var(--sakura-light); outline: none; font-size: 14px; color: #5D5D5D; }
        
        .btn-submit { width: 100%; padding: 15px; background: var(--sakura-deep); color: white; border: none; border-radius: 18px; font-weight: 900; cursor: pointer; margin-top: 10px; }
        .btn-submit.income-mode { background: var(--income-blue); }
    </style>
</head>
<body>

<div class="phone-container">
    <header>
        <p class="subtitle">Future Rich Woman Planner</p>
        <h1 class="title">成為富婆GOGOGO 💰</h1>
    </header>

    <div id="page-dream" class="page active">
        <div class="balance-card">
            <div class="balance-label">當前富婆儲備金 🎀</div>
            <div class="balance-amount" id="display-balance">$20,500</div>
            <div style="font-size: 10px; background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 10px; display: inline-block;">
                ✨ 每一分錢都在為夢想打工
            </div>
        </div>

        <div class="section-title"><span>⚙️</span> 目標自定義 SETTINGS (可改名)</div>
        <div class="settings-section">
            <div class="setting-row">
                <div class="settings-label"><span>💰</span> 初始基金</div>
                <input type="number" id="init-fund-input" class="settings-input" value="20500" oninput="updateAllCalculations()">
            </div>
            <div class="setting-row">
                <div class="settings-label">
                    <span>🎯</span>
                    <!-- 加入可修改的名稱輸入框 -->
                    <input type="text" id="name-goal1" class="settings-name-input" value="清還卡數" oninput="updateAllCalculations()">
                </div>
                <input type="number" id="target-goal1" class="settings-input" value="5900" oninput="updateAllCalculations()">
            </div>
            <div class="setting-row">
                <div class="settings-label">
                    <span>🎯</span>
                    <input type="text" id="name-goal2" class="settings-name-input" value="S26 Ultra" oninput="updateAllCalculations()">
                </div>
                <input type="number" id="target-goal2" class="settings-input" value="10000" oninput="updateAllCalculations()">
            </div>
            <div class="setting-row">
                <div class="settings-label">
                    <span>🎯</span>
                    <input type="text" id="name-goal3" class="settings-name-input" value="泰國之旅" oninput="updateAllCalculations()">
                </div>
                <input type="number" id="target-goal3" class="settings-input" value="7000" oninput="updateAllCalculations()">
            </div>
        </div>

        <div class="section-title"><span>📈</span> 夢想進度條 PROGRESS</div>
        <div class="goal-card" style="border-left: 5px solid #FF85A1;">
            <div class="goal-icon">💵</div>
            <div class="goal-info">
                <div class="goal-header">
                    <!-- 這裡的名稱會自動跟隨設定更新 -->
                    <span class="goal-name"><span id="display-name-goal1">清還卡數</span> <span class="goal-target-text" id="label-goal1">($5,900)</span></span>
                    <span class="goal-percent" id="goal1-percent">0%</span>
                </div>
                <div class="progress-bg"><div class="progress-fill" id="goal1-bar" style="width: 0%;"></div></div>
            </div>
        </div>
        <div class="goal-card">
            <div class="goal-icon">🎯</div>
            <div class="goal-info">
                <div class="goal-header">
                    <span class="goal-name"><span id="display-name-goal2">S26 Ultra</span> <span class="goal-target-text" id="label-goal2">($10,000)</span></span>
                    <span class="goal-percent" id="goal2-percent">0%</span>
                </div>
                <div class="progress-bg"><div class="progress-fill" id="goal2-bar" style="width: 0%;"></div></div>
            </div>
        </div>
        <div class="goal-card">
            <div class="goal-icon">🎯</div>
            <div class="goal-info">
                <div class="goal-header">
                    <span class="goal-name"><span id="display-name-goal3">泰國之旅</span> <span class="goal-target-text" id="label-goal3">($7,000)</span></span>
                    <span class="goal-percent" id="goal3-percent">0%</span>
                </div>
                <div class="progress-bg"><div class="progress-fill" id="goal3-bar" style="width: 0%;"></div></div>
            </div>
        </div>
    </div>

    <!-- 頁面 2：記帳頁面 -->
    <div id="page-ledger" class="page">
        <div class="section-title"><span>📊</span> 財務概覽 SUMMARY</div>
        
        <div class="summary-grid">
            <div class="summary-item">
                <div class="summary-lab">總收入 💰</div>
                <div class="summary-val val-income" id="total-income-display">$0</div>
            </div>
            <div class="summary-item">
                <div class="summary-lab">總支出 💸</div>
                <div class="summary-val val-expense" id="total-expense-display">$0</div>
            </div>
            <div class="summary-item full">
                <div class="summary-lab">當前結餘 BALANCE 🎀</div>
                <div class="summary-val val-balance" id="ledger-balance-display">$20,500</div>
            </div>
        </div>

        <div class="section-title"><span>✍️</span> 增加富婆財富 RECORD</div>
        <div class="input-card">
            <div class="type-toggle">
                <div id="tab-expense" class="type-btn active expense" onclick="setType('expense')">支出 💸</div>
                <div id="tab-income" class="type-btn income" onclick="setType('income')">收入 💰</div>
            </div>
            <div class="input-group">
                <label id="label-amount">金額 AMOUNT</label>
                <input type="number" id="input-amount" placeholder="0.00">
            </div>
            <div class="input-group">
                <label>類別 CATEGORY</label>
                <select id="input-category">
                    <option>飲食 🍕</option>
                    <option>交通 🚌</option>
                    <option>薪金/獎金 💵</option>
                    <option>生活開支 🛍️</option>
                    <option>清還卡數 💳</option>
                    <option>美甲/美容 💅</option>
                    <option>其他 🌸</option>
                </select>
            </div>
            <div class="input-group">
                <label>備註/名稱 REMARKS</label>
                <input type="text" id="input-note" placeholder="例如：午餐、巴士、獎金...">
            </div>
            <button class="btn-submit" id="btn-submit" onclick="saveRecord()">記下這筆支出 🌸</button>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('dream', this)">🏠 夢想</div>
        <div class="nav-item" onclick="switchPage('ledger', this)">📖 帳本</div>
    </div>
</div>

<script>
    let currentType = 'expense';
    let totalIncome = 0;
    let totalExpense = 0;

    window.onload = function() {
        const savedData = localStorage.getItem('richWomanData');
        if (savedData) {
            const data = JSON.parse(savedData);
            document.getElementById('init-fund-input').value = data.currentFund;
            totalIncome = data.totalIncome || 0;
            totalExpense = data.totalExpense || 0;
            
            // 讀取目標金額
            document.getElementById('target-goal1').value = data.target1 || 5900;
            document.getElementById('target-goal2').value = data.target2 || 10000;
            document.getElementById('target-goal3').value = data.target3 || 7000;

            // 讀取自定義目標名稱
            document.getElementById('name-goal1').value = data.name1 || '清還卡數';
            document.getElementById('name-goal2').value = data.name2 || 'S26 Ultra';
            document.getElementById('name-goal3').value = data.name3 || '泰國之旅';
        }
        updateAllCalculations();
    };

    function saveData() {
        const data = {
            currentFund: parseFloat(document.getElementById('init-fund-input').value),
            totalIncome: totalIncome,
            totalExpense: totalExpense,
            target1: document.getElementById('target-goal1').value,
            target2: document.getElementById('target-goal2').value,
            target3: document.getElementById('target-goal3').value,
            name1: document.getElementById('name-goal1').value,
            name2: document.getElementById('name-goal2').value,
            name3: document.getElementById('name-goal3').value
        };
        localStorage.setItem('richWomanData', JSON.stringify(data));
    }

    function updateAllCalculations() {
        const currentFund = parseFloat(document.getElementById('init-fund-input').value) || 0;
        const targets = {
            goal1: parseFloat(document.getElementById('target-goal1').value) || 1,
            goal2: parseFloat(document.getElementById('target-goal2').value) || 1,
            goal3: parseFloat(document.getElementById('target-goal3').value) || 1
        };

        // 更新總金額顯示
        document.getElementById('display-balance').innerText = '$' + currentFund.toLocaleString();
        document.getElementById('ledger-balance-display').innerText = '$' + currentFund.toLocaleString();
        document.getElementById('total-income-display').innerText = '$' + totalIncome.toLocaleString();
        document.getElementById('total-expense-display').innerText = '$' + totalExpense.toLocaleString();

        // 更新進度條上的名稱
        document.getElementById('display-name-goal1').innerText = document.getElementById('name-goal1').value || '目標 1';
        document.getElementById('display-name-goal2').innerText = document.getElementById('name-goal2').value || '目標 2';
        document.getElementById('display-name-goal3').innerText = document.getElementById('name-goal3').value || '目標 3';

        // 更新進度條上的目標金額
        document.getElementById('label-goal1').innerText = '($' + targets.goal1.toLocaleString() + ')';
        document.getElementById('label-goal2').innerText = '($' + targets.goal2.toLocaleString() + ')';
        document.getElementById('label-goal3').innerText = '($' + targets.goal3.toLocaleString() + ')';

        // 更新進度條長度
        updateProgressBar('goal1', currentFund, targets.goal1);
        updateProgressBar('goal2', currentFund, targets.goal2);
        updateProgressBar('goal3', currentFund, targets.goal3);
        
        saveData();
    }

    function updateProgressBar(id, current, target) {
        let percent = (current / target) * 100;
        if (percent > 100) percent = 100;
        if (percent < 0) percent = 0;
        document.getElementById(id + '-percent').innerText = Math.floor(percent) + '%';
        document.getElementById(id + '-bar').style.width = percent + '%';
    }

    function switchPage(pageId, element) {
        const pages = document.querySelectorAll('.page');
        pages.forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');

        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => item.classList.remove('active'));
        element.classList.add('active');
    }

    function setType(type) {
        currentType = type;
        const tabExpense = document.getElementById('tab-expense');
        const tabIncome = document.getElementById('tab-income');
        const btnSubmit = document.getElementById('btn-submit');
        if (type === 'expense') {
            tabExpense.classList.add('active');
            tabIncome.classList.remove('active');
            btnSubmit.classList.remove('income-mode');
            btnSubmit.innerText = '記下這筆支出 🌸';
        } else {
            tabIncome.classList.add('active');
            tabExpense.classList.remove('active');
            btnSubmit.classList.add('income-mode');
            btnSubmit.innerText = '存入這筆收入 💰';
        }
    }

    function saveRecord() {
        const amountInput = document.getElementById('input-amount');
        const amount = parseFloat(amountInput.value);
        if (!amount) { alert('請輸入金額喔！🌸'); return; }
        
        let currentFund = parseFloat(document.getElementById('init-fund-input').value) || 0;
        
        if (currentType === 'expense') {
            currentFund -= amount;
            totalExpense += amount;
        } else {
            currentFund += amount;
            totalIncome += amount;
        }
        
        document.getElementById('init-fund-input').value = currentFund;
        updateAllCalculations();
        
        alert('記錄成功！富婆之路又進一步了！✨');
        amountInput.value = '';
        document.getElementById('input-note').value = '';
    }
</script>
</body>
</html>
